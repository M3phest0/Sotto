[package]
name = "sotto"
version = "0.1.0"
description = "Sotto desktop widget for Windows 11"
edition = "2021"
rust-version = "1.82"

[lib]
name = "sotto_lib"
# 仅桌面 Windows：cdylib 在 windows-gnu + rust-lld 下会因导出符号超过 65535 而失败；
# 桌面构建只需要 rlib（bin 链接它）。移动端才需要 staticlib/cdylib。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sotto-core = { path = "core" }
rfd = "0.15"
notify = "8"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
