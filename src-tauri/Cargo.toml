[package]
name = "sotto"
version = "0.1.0"
description = "Sotto desktop widget for Windows 11"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sotto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
